<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 방 선택 · Lumai</title>
<style>
:root{--wine:#6f2340;--ink:#2f2727;--muted:#786e69;--paper:#faf7f1;--line:#e3d9cf;--wall:#5b704b;--door:#266a9a;--window:#b7822d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#ead8dc,#d7c5bc 68%);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif}.phone{width:min(100%,430px);min-height:100dvh;margin:auto;background:var(--paper);padding:18px 20px max(24px,env(safe-area-inset-bottom));box-shadow:0 20px 70px #3f202b35}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font:italic 800 22px Georgia,serif;color:var(--wine)}.back{color:var(--muted);text-decoration:none;font-size:12px}h1{font-size:27px;line-height:1.2;letter-spacing:-.055em;margin:0 0 8px}p{margin:0}.intro{color:var(--muted);font-size:12px;margin-bottom:18px}.status{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:13px;background:#eee8df;margin-bottom:11px}.status strong{font-size:12px}.badge{font-size:10px;padding:4px 8px;border-radius:99px;background:#ddd5cb}.badge.ready{background:#e3eadc;color:#47603e}.upload{display:grid;place-items:center;min-height:86px;border:1px dashed #c7b9b1;border-radius:16px;background:#fff9;color:var(--wine);cursor:pointer;text-align:center}.upload input{position:absolute;opacity:0;pointer-events:none}.upload b{display:block}.upload small{color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0 13px}button{min-height:43px;border:0;border-radius:13px;background:#eee5df;color:var(--ink);font-weight:750}button.primary{background:linear-gradient(120deg,#873650,#57192f);color:white}button:disabled{opacity:.45}.stage{position:relative;border-radius:17px;overflow:hidden;background:#e9e3da;min-height:250px;box-shadow:inset 0 0 0 1px #ddd2c7}canvas{display:block;width:100%;height:auto;min-height:250px;object-fit:contain;touch-action:manipulation}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);pointer-events:none}.empty[hidden]{display:none}.legend{display:flex;flex-wrap:wrap;gap:10px;margin:10px 2px;font-size:10px;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.message{padding:11px 12px;background:#f0e9e3;border-left:3px solid var(--wine);border-radius:4px 12px 12px 4px;font-size:12px;min-height:54px}.metrics{margin-top:7px;color:var(--muted);font-size:10px}.confirm{width:100%;margin-top:12px}.steps{display:flex;gap:5px;margin-bottom:9px}.steps span{height:3px;flex:1;border-radius:99px;background:#ded4cb}.steps span.on{background:var(--wine)}
</style>
</head>
<body><main class="phone"><header><div class="brand">Lumai<sup>AI</sup></div><a class="back" href="index.html">메인으로</a></header><div class="steps"><span class="on"></span><span id="step2"></span><span id="step3"></span></div><h1>평면도에서<br>사용할 방을 골라요.</h1><p class="intro">AI가 벽·문·창문을 나눠 찾은 뒤, 방 바닥을 한 번 눌러 주세요.</p><div class="status"><strong>벽·문·창문 U-Net</strong><span class="badge" id="model-badge">확인 중</span></div><label class="upload"><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><span><b id="upload-title">평면도 올리기 ＋</b><small>8MB 이하 PNG · JPG · WebP</small></span></label><div class="actions"><button id="sample">예시 평면도</button><button class="primary" id="analyze" disabled>AI로 구조 찾기</button></div><section class="stage"><canvas id="canvas" width="720" height="500" aria-label="AI 구조 분석 결과와 방 선택"></canvas><div class="empty" id="empty">평면도를 올리면<br>분석 결과가 여기에 보여요.</div></section><div class="legend"><span><i style="background:var(--wall)"></i>벽</span><span><i style="background:var(--door)"></i>문 · 통과</span><span><i style="background:var(--window)"></i>창문 · 막힘</span><span><i style="background:var(--wine)"></i>선택한 방</span></div><div class="message" id="message" role="status">모델 상태를 확인하고 있어요.</div><p class="metrics" id="metrics"></p><button class="primary confirm" id="confirm" hidden>이 방으로 계속하기 →</button></main>
<script>
const $=id=>document.getElementById(id),state={ready:false,dataUrl:null,image:null,labels:null,room:null,result:null};const canvas=$('canvas'),ctx=canvas.getContext('2d');
function message(text){$('message').textContent=text}function dataUrlFromBlob(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}function loadImage(src){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=src})}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(!state.image)return;canvas.height=Math.max(300,Math.round(canvas.width*state.image.naturalHeight/state.image.naturalWidth));ctx.drawImage(state.image,0,0,canvas.width,canvas.height);if(!state.labels)return;const rows=state.labels,h=rows.length,w=rows[0].length,colors={'1':'#5b704baa','2':'#266a9acc','3':'#b7822dcc'};for(let y=0;y<h;y++)for(let x=0;x<w;x++){const color=colors[rows[y][x]];if(color){ctx.fillStyle=color;ctx.fillRect(x/w*canvas.width,y/h*canvas.height,canvas.width/w+.5,canvas.height/h+.5)}if(state.room?.[y*w+x]){ctx.fillStyle='#79344d66';ctx.fillRect(x/w*canvas.width,y/h*canvas.height,canvas.width/w+.5,canvas.height/h+.5)}}}
async function setImage(dataUrl,name){state.dataUrl=dataUrl;state.image=await loadImage(dataUrl);state.labels=null;state.room=null;state.result=null;$('upload-title').textContent=name;$('empty').hidden=true;$('confirm').hidden=true;$('analyze').disabled=!state.ready;$('step2').className='';$('step3').className='';$('metrics').textContent='';message(state.ready?'AI로 구조 찾기를 눌러 주세요.':'세 종류 인식 모델이 준비되지 않았어요.');draw()}
async function analyze(){if(!state.ready||!state.dataUrl)return;$('analyze').disabled=true;message('이미지를 정규화하고 U-Net이 픽셀별로 분석하고 있어요…');try{const response=await fetch('/api/v1/floorplans/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:state.dataUrl})});const data=await response.json();if(!response.ok)throw Error(data.error?.message||'분석에 실패했어요.');state.labels=data.labels;state.result=data;state.room=null;$('step2').className='on';$('metrics').textContent='추론 '+data.inferenceMs+'ms · 평균 확신도 '+(data.meanConfidence*100).toFixed(1)+'%';message('색상별 구조를 찾았어요. 사용할 방의 바닥을 눌러 주세요.');draw()}catch(error){message(error.message)}finally{$('analyze').disabled=!state.ready}}
function chooseRoom(point){if(!state.labels)return;const rows=state.labels,h=rows.length,w=rows[0].length,sx=Math.min(w-1,Math.floor(point[0]*w)),sy=Math.min(h-1,Math.floor(point[1]*h));if(rows[sy][sx]!=='0'){message('색칠된 구조가 아닌 방 바닥을 눌러 주세요.');return}const room=new Uint8Array(w*h),queue=[sy*w+sx];room[sy*w+sx]=1;for(let i=0;i<queue.length;i++){const p=queue[i],x=p%w,y=Math.floor(p/w);for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]){if(nx<0||ny<0||nx>=w||ny>=h)continue;const n=ny*w+nx;if(!room[n]&&rows[ny][nx]==='0'){room[n]=1;queue.push(n)}}}state.room=room;$('confirm').hidden=false;$('step3').className='on';message('버건디로 표시된 방을 선택했어요. 다시 누르면 다른 방으로 바꿀 수 있어요.');draw()}
$('file').onchange=async event=>{const file=event.target.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>8_000_000){message('8MB 이하 평면도 이미지를 선택해 주세요.');return}await setImage(await dataUrlFromBlob(file),file.name)};$('sample').onclick=async()=>{const response=await fetch('/sample/floorplan.png');await setImage(await dataUrlFromBlob(await response.blob()),'예시 평면도')};$('analyze').onclick=analyze;canvas.onclick=event=>{const box=canvas.getBoundingClientRect();chooseRoom([(event.clientX-box.left)/box.width,(event.clientY-box.top)/box.height])};$('confirm').onclick=()=>location.href='index.html';
async function status(){try{const response=await fetch('/api/v1/model/status');const data=await response.json();state.ready=Boolean(data.ready);$('model-badge').textContent=data.ready?'사용 가능':'준비 전';$('model-badge').classList.toggle('ready',data.ready);message(data.message);$('analyze').disabled=!(state.ready&&state.dataUrl)}catch{message('AI 서버 연결을 확인해 주세요.')}}status();
</script></body></html>
