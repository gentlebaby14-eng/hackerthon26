/* Frosted surfaces sit over the warm room palette. */
body{background:radial-gradient(ellipse at 91% 0%,#e3c4cc 0%,transparent 36%),radial-gradient(ellipse at 9% 88%,#eedbc9 0%,transparent 43%),#f8f4ee}

.editorial figcaption strong{line-height:1.3}.editorial figcaption span{margin-top:3px}
.primary,.chat-open{transition:background-color .16s ease,border-color .16s ease,box-shadow .16s ease}

/* Align each stage to one page inset and a consistent vertical rhythm. */

  nav li>span,nav li button{padding-block:5px 6px}
  .hero,main[data-stage="1"] .hero{padding:10px 0 9px}
  .visual{padding:7px}.visual-top{margin-bottom:4px}
  .footer{padding-top:7px}.motion-bar{margin-top:4px}
}

@media(max-width:345px){.shell{--page-inset:12px}.header-right{gap:5px}}

/* An editorial composition with open space and softly curved surfaces. */
:root{--paper:#f8f5ee;--white:#fcfaf5;--line:#e4dbd0}
body{background:#f8f5ee}
.shell{
  --page-inset:22px;
  --section-gap:15px;
  grid-template-rows:53px 33px minmax(0,1fr);
  background:radial-gradient(ellipse at 100% 0%,#eedde0a8 0%,transparent 40%),#f8f5ee;
}
@media(min-width:500px){
  body{background:radial-gradient(ellipse at 50% 22%,#f0e8e0,#e1d4c9 62%,#d4c2b7)}
  .shell{border-radius:30px}
}
header{border:0}
nav ol{border-bottom:1px solid #e2d8ce}
nav li[aria-current]::after{border-radius:999px}
.chat-open{border-color:transparent;background:#f1e4e6;box-shadow:none}
.hero{padding:17px 0 12px}
.hero h1{font-weight:650;letter-spacing:-.05em}
main[data-stage="1"]{
  grid-template-columns:minmax(0,.98fr) minmax(0,1.02fr);
  grid-template-rows:minmax(0,1fr) auto;
  column-gap:13px;
  row-gap:0;
}
main[data-stage="1"] .workspace{display:contents}
main[data-stage="1"] .hero{
  grid-column:1;grid-row:1;align-self:center;
  padding:0 0 16px;
}
main[data-stage="1"] .hero h1{
  font-size:clamp(21px,6.8cqw,28px);
  font-weight:680;letter-spacing:-.055em;line-height:1.32;
  word-break:keep-all;overflow-wrap:normal;
  color:#39282a;
}
main[data-stage="1"] .hero p{
  display:block;margin-top:12px;
  font-size:clamp(11px,3.1cqw,12px);line-height:1.63;color:#705e56;
}
main[data-stage="1"] .visual{
  grid-column:2;grid-row:1;align-self:center;
  height:calc(100% - 28px);max-height:365px;
  border-radius:26px 26px 26px 8px;
  box-shadow:none;order:0;
}
.editorial{
  border-radius:inherit;
  box-shadow:none;
}
.editorial img{object-position:55% 51%}
.editorial::before{box-shadow:none}
.editorial figcaption{
  left:10px;bottom:10px;padding:5px 9px;
  gap:0;border:0;border-radius:12px;
  background:#37262370;box-shadow:none;
}
.editorial figcaption strong{font:650 11px/1.3 var(--sans)}
.editorial figcaption span{font-size:9px;margin-top:2px}
main[data-stage="1"] .panel{
  grid-column:1/-1;grid-row:2;
  padding:14px 0 0;border-top:1px solid var(--line);
  background:none;box-shadow:none;
}
main[data-stage="1"] .panel h2{font-size:14px;margin-bottom:10px}
.panel{border:0;box-shadow:none;background:transparent;padding:0}
.visual{border:0;border-radius:23px;box-shadow:none;padding:9px;background:#eee7dc}
.visual-top{margin:2px 5px 7px}
.plan-card{border:0;border-radius:15px;background:#f9f6f0}
.plan-card figcaption{border:0;padding:5px 9px 4px;background:#f9f6f0}
.plan-canvas{background:#f1eee7}
.motion-bar{
  border:0;box-shadow:none;border-radius:12px;
  margin-top:7px;padding:3px 5px;background:#f7f2e8;
}
.motion-play{box-shadow:none;border:0;background:#eee0e4}
.legend{margin:6px 5px 0}
.entry{border:1px solid transparent;border-radius:12px;background:#eee8dd}
.entry:focus-within{border-color:#b67e91;outline:0}
textarea{border:1px solid #e1d8cd;border-radius:14px;background:#fbf8f2}
.options{gap:5px}
.chip{background:#efe9df;border-color:transparent}
.chip[aria-pressed=true]{border-color:#bd8f9e;background:#f1e2e6;box-shadow:none}
.room-tabs,.compare-tabs{gap:3px;background:#e8e0d5;border-radius:999px;padding:3px}
.room-tabs button,.compare-tabs button{
  flex:1;min-width:0;border:0;border-radius:999px;background:transparent;
  color:#63524c;box-shadow:none;min-height:27px;
}
.room-tabs button[aria-pressed=true],.compare-tabs button[aria-pressed=true]{
  background:#fdfaf5;color:#651d35;box-shadow:0 1px 3px #4a251621;
}
.stat,.product{border:0;border-radius:13px;background:#efe8de}
.product canvas,.product img{border-radius:8px}
.product[aria-pressed=true]{background:#f0e1e6;box-shadow:inset 0 0 0 1px #b48294}
.result{border:0;border-radius:12px;background:#eee7dc}
.footer{padding-top:9px}
.footer .primary{border-radius:16px;box-shadow:0 3px 8px #681f3828}
.footer button[data-action=back]{border-color:transparent;background:#efe7dd;border-radius:14px}
.chat-dialog{border-radius:24px}
@media(max-width:375px){.shell{--page-inset:17px}main[data-stage="1"]{column-gap:10px}}
@media(max-width:345px){
  .shell{--page-inset:12px}
  main[data-stage="1"] .hero h1{font-size:23px}
  main[data-stage="1"] .hero p{font-size:11px}
}
@media(max-height:660px){
  .shell{grid-template-rows:47px 30px minmax(0,1fr);--section-gap:10px}
  .hero{padding:10px 0 8px}
  main[data-stage="1"] .hero{padding:0 0 8px}
  main[data-stage="1"] .hero p{margin-top:7px}
  main[data-stage="1"] .visual{height:calc(100% - 16px);border-radius:20px 20px 20px 7px}
  main[data-stage="1"] .panel{padding-top:8px}
  main[data-stage="1"] .panel h2{margin-bottom:6px}
  .visual{padding:6px}.visual-top{margin:1px 4px 4px}
  .motion-bar{margin-top:4px}
}

/* Bring the wine tones back without changing the portrait composition. */
.shell{
  background:
    radial-gradient(ellipse at 103% -5%,#b96e86ad 0%,#ddb0be99 22%,transparent 55%),
    linear-gradient(158deg,#f5e7e8 0%,#f8f5ee 48%,#f8f5ee 76%,#f1e1e4 100%);
}
.footer .primary{
  background:linear-gradient(115deg,#a34c68 0%,#842c4c 32%,#671c37 68%,#4c1229 100%);
  border-color:#72203d;
  box-shadow:inset 0 1px 0 #ffffff36,0 4px 10px #6d224437;
}
.footer .primary:hover:enabled{
  background:linear-gradient(115deg,#ae5973 0%,#8c3453 32%,#6c203b 68%,#51162d 100%);
}
.chat-open{background:linear-gradient(120deg,#faeff1,#e4c2ce);border-color:#d2a2b3}
@media(min-width:500px){
  body{background:radial-gradient(ellipse at 49% 10%,#d6adb8 0%,#ac788b 39%,#783b53 78%,#552138 100%)}
}

/* Room-photo recommendation within the second stage. */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.room-search fieldset{margin-bottom:13px}
.search-constraints{color:var(--muted);font-size:11px;margin:1px 0 13px}
.search-constraints span{padding:0 2px}
.room-photo-section h2{margin-bottom:7px}
.room-photo-drop{
  display:grid;grid-template-columns:46px minmax(0,1fr) 25px;gap:10px;align-items:center;
  min-height:66px;padding:8px 10px;border:1px dashed #b88a99;border-radius:15px;background:#f4e9ea;cursor:pointer;
}
#room-photo-input:focus-visible+.room-photo-drop{outline:2px solid var(--wine);outline-offset:3px}
.room-photo-drop:hover{border-color:var(--wine)}
.room-photo-icon,.room-photo-thumb{display:grid;place-items:center;width:46px;height:46px;border-radius:10px;background:#ead5dc;color:var(--wine);object-fit:cover}
.room-photo-icon svg{width:24px;height:24px}
.room-photo-drop strong,.room-photo-drop small,.room-photo-summary strong,.room-photo-summary small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-photo-drop strong,.room-photo-summary strong{font-size:13px;color:var(--wine)}
.room-photo-drop small,.room-photo-summary small{font-size:11px;color:var(--muted);margin-top:2px}
.room-photo-add{display:grid;place-items:center;border-radius:50%;height:25px;background:#fffb;color:var(--wine);font-size:17px;line-height:1}
.sample-photo{margin-top:4px;padding:2px 0;border:0;background:transparent;color:var(--wine);font-size:11px;min-height:26px;text-decoration:underline;text-underline-offset:3px}
.photo-error{color:#8e332f;font-size:11px;margin-top:4px}
.room-photo-summary{display:grid;grid-template-columns:37px minmax(0,1fr);align-items:center;gap:9px;margin:0 0 11px;padding:6px 8px;background:#f0e5e5;border-radius:12px}
.room-photo-summary img{width:37px;height:37px;object-fit:cover;border-radius:7px}
@media(max-height:620px){.room-search fieldset{margin-bottom:8px}.search-constraints{margin-bottom:8px}.room-photo-summary{margin-bottom:7px}}

function roomBounds() {
  const rows = state.structure.room;
  if (!rows?.length || !rows[0]?.length) return null;
  if (rows === cachedRoom) return cachedBounds;
  let left=rows[0].length, top=rows.length, right=-1, bottom=-1;
  for (let y=0;y<rows.length;y++) for (let x=0;x<rows[0].length;x++) {
    if (!inside(rows,x,y)) continue;
    left=Math.min(left,x); top=Math.min(top,y); right=Math.max(right,x); bottom=Math.max(bottom,y);
  }
  cachedRoom=rows;
  cachedBounds=right>=left?{left,top,w:right-left+1,h:bottom-top+1}:null;
  return cachedBounds;
}

function roomCell(x,y,b=roomBounds()) {
  return !!b && x>=0 && x<1 && y>=0 && y<1 && inside(state.structure.room,b.left+Math.floor(x*b.w),b.top+Math.floor(y*b.h));
}
function footprint(item) {
  return {w:item.w/roomWidth(),d:item.d/roomDepth()};
}
function itemFits(item, x=item.x, y=item.y) {
  const bounds=roomBounds(), {w,d}=footprint(item);
  if (!bounds || !(w>0 && d>0) || x-w/2<0 || x+w/2>1 || y-d/2<0 || y+d/2>1) return false;
  for (let row=Math.floor((y-d/2)*bounds.h);row<Math.ceil((y+d/2)*bounds.h);row++) {
    for (let col=Math.floor((x-w/2)*bounds.w);col<Math.ceil((x+w/2)*bounds.w);col++) {
      if (!inside(state.structure.room,bounds.left+col,bounds.top+row)) return false;
    }
  }
  return true;
}
function overlaps(item,other,x=item.x,y=item.y) {
  const gap=10;
  return Math.abs(x-other.x)<(item.w+other.w+gap*2)/(2*roomWidth()) &&
    Math.abs(y-other.y)<(item.d+other.d+gap*2)/(2*roomDepth());
}
function layoutFits() {
  return positive(roomWidth()) && positive(roomDepth()) && draft.items.every((item,index)=>

}

function doorSwingZone() {
  const side=effectiveDoorSide();if(!side)return null;
  const preset=knownDemoPlan(),anchor=preset?.door||({top:[.5,0],bottom:[.5,1],left:[0,.5],right:[1,.5]})[side];
  const doorWidth=Math.min(.32,90/(side==='top'||side==='bottom'?roomWidth():roomDepth()));
  const depth=Math.min(.38,90/(side==='top'||side==='bottom'?roomDepth():roomWidth()));
  if(side==='top')return {x1:anchor[0]-doorWidth,x2:anchor[0]+doorWidth,y1:0,y2:depth};
  if(side==='bottom')return {x1:anchor[0]-doorWidth,x2:anchor[0]+doorWidth,y1:1-depth,y2:1};
  if(side==='left')return {x1:0,x2:depth,y1:anchor[1]-doorWidth,y2:anchor[1]+doorWidth};
  return {x1:1-depth,x2:1,y1:anchor[1]-doorWidth,y2:anchor[1]+doorWidth};
}
function intersectsDoorSwing(item,x=item.x,y=item.y) {
  const z=doorSwingZone();if(!z)return false;const {w,d}=footprint(item);
  return x+w/2>z.x1&&x-w/2<z.x2&&y+d/2>z.y1&&y-d/2<z.y2;
}
function itemClearance(item,others,x=item.x,y=item.y) {
  const wall=Math.min((x-item.w/roomWidth()/2)*roomWidth(),(1-x-item.w/roomWidth()/2)*roomWidth(),
    (y-item.d/roomDepth()/2)*roomDepth(),(1-y-item.d/roomDepth()/2)*roomDepth());
  let clearance=wall;
  for(const other of others) {
    const dx=Math.max(0,Math.abs((x-other.x)*roomWidth())-(item.w+other.w)/2);
    const dy=Math.max(0,Math.abs((y-other.y)*roomDepth())-(item.d+other.d)/2);
    clearance=Math.min(clearance,Math.hypot(dx,dy));
  }
  return Math.max(0,clearance*2);
}
function usableArea(items) {return Math.max(0,(roomWidth()*roomDepth()-items.reduce((sum,item)=>sum+item.w*item.d,0))/10000);}
function routeBetween(items,start,end,passage='12') {
  const savedStart=state.startPoint,savedEnd=state.endPoint,savedPassage=state.passage;
  state.startPoint=start;state.endPoint=end;state.passage=passage;
  const result=findLayoutRoute(items);
  state.startPoint=savedStart;state.endPoint=savedEnd;state.passage=savedPassage;
  return result;
}
function evaluateArrangement(items,target,start,end) {
  const others=items.filter(item=>item.id!==target.id),passage=itemClearance(target,others);
  const route=routeBetween(items,start,end,String(Math.min(24,Math.max(10,Number(state.passage)||12))));
  const usable=usableArea(items),distance=route.path?.length?route.distance:Infinity;
  const distanceScore=Number.isFinite(distance)?Math.max(0,100-distance/8):0;
  return {passage,distance,usable,route,score:Math.round((Math.min(100,passage)*.5+distanceScore*.35+Math.min(100,usable*10)*.15)*10)/10};
}
function optimizeFurnitureLayout() {
  const target=[...draft.items].reverse().find(item=>item.source==='product'||item.source==='manual');
  draft.optimization=null;draft.optimizationMessage='';

  if(a.length!==4 || !a.every(v=>typeof v==='number'&&Number.isFinite(v))) return null;

async function detectPhotoFurniture() {

    clearRoutes();
  } catch(error) {
    if(labels===state.structure.labels) state.structure.message=error.message;
  } finally {
    draft.roomBusy=false;
    render();
  }
}
chooseUploadedRoom=selectFlowRoom;

render=function renderFlow() {
  const page=draft.page, ws=$('#workspace');
  $('.shell').dataset.intro=page===0;
  $('main').dataset.stage=page+1;
  ws.dataset.step=page+1;
  ws.classList.toggle('flow',page>0);ws.classList.toggle('layout-editor',page===4);
  ws.classList.toggle('has-plan',[2,4,5].includes(page));
  $('#progress').innerHTML=flowTabs.map((title,i)=>'<li '+(page===i+1?'aria-current="step"':'')+'><button data-flow-page="'+(i+1)+'" '+(i+1>page?'disabled':'')+'>'+title+'</button></li>').join('');
  $('#headline').innerHTML=page===0?'가구를 들이기 전,<br>생활을 먼저 그려보세요.':flowTitles[page];
  $('#intro').textContent=['','방 용도와 필요한 가구를 골라 주세요.','도면 위에서 원하는 방의 바닥을 터치하세요.','배치해 볼 가구를 골라 주세요.','가구를 터치하거나 끌어서 배치하세요.','가구 사이의 반복 생활 동선과 불편 구간을 비교하세요.'][page];
  $('#controls').innerHTML=page===0?controls():flowControls();
  $('#visual').hidden=![0,2,4,5].includes(page);
  $('#visual').innerHTML=page===0?visual():page===2?
    '<figure class="plan-card"><div class="plan-canvas"><canvas width="960" height="660" data-uploaded-plan aria-label="방 선택 평면도"></canvas></div></figure><div class="legend"><span>파랑 · 벽</span><span>빨강 · 문</span><span>반투명 빨강 · 선택한 방</span></div>':
    page===4?'<figure class="plan-card"><figcaption>평면도 가구 배치</figcaption><div class="plan-canvas"><canvas width="960" height="660" id="layout-plan" aria-label="선택한 방의 가구 배치"></canvas></div></figure><div class="legend"><span>베이지 · 현재 가구</span><span>버건디 · 새 가구</span></div>':
    page===5?'<figure class="plan-card"><div class="plan-canvas"><canvas width="960" height="660" id="layout-plan" aria-label="반복 생활 동선 분석 평면도"></canvas></div></figure><div class="legend"><span>연한~진한 버건디 · 시뮬레이션 이동 빈도</span><span>빨강 · 좁은 구간</span><span>주황 · 보호대 검토 모서리</span></div>':'';
  if(page===2){drawUploadedPlan();bindUploadedPlan();}
  if(page===4||page===5){paintLayout();bindLayout();}
};

function updateFlowField(input) {
  const key=input.dataset.field, size=input.dataset.size;
  if(key) state[key]=input.value;
  if(size && positive(input.value) && selectedItem()) selectedItem()[size]=Number(input.value);
  if(size || ['width','height','passage'].includes(key)) clearRoutes();
  if(draft.page===4) {
    $('#layout-message').textContent=layoutMessage();
    $('[data-flow="to-sim"]').disabled=false;
    paintLayout();
  }
  if(draft.page===5) {
    if(['age','activity'].includes(key)){draft.simulation=null;stopLayoutMotion(true);render();return;}
    const run=$('[data-flow="run"]');if(run)run.disabled=!state.startPoint||!state.endPoint||!positive(state.passage);
    const status=$('#controls [role="status"]');if(status)status.textContent='동선을 다시 계산해 주세요.';
    const replay=$('[data-flow="replay"]');
    if(replay) replay.hidden=true;
    paintLayout();
  }
}
document.addEventListener('input',event=>{
  if(event.target.dataset.simulation){event.stopImmediatePropagation();const key=event.target.dataset.simulation;if(key==='count')draft.simulationCount=Math.max(100,Math.min(500,Number(event.target.value)||100));if(key==='seed')draft.simulationSeed=Math.round(Number(event.target.value)||1);return;}
  if(!event.target.matches('[data-field],[data-size]')) return;
  event.stopImmediatePropagation();
  updateFlowField(event.target);
},true);
document.addEventListener('change',async event=>{
  const input=event.target, key=input.dataset.field;
  if(input.dataset.simulation==='speed'){event.stopImmediatePropagation();draft.playbackSpeed=Number(input.value)||1;return;}
  if(input.id==='photo-door-side'){
    event.stopImmediatePropagation();draft.doorSide=input.value;
    for(const item of draft.items) if(item.source==='yolo'&&!item.corrected) projectPhotoItem(item);
    settleProjectedItems();
    captureInitialLayout(draft.items.filter(item=>item.source==='yolo'&&!item.corrected));
    clearRoutes();render();return;
  }
  if(key || input.dataset.size) {
    event.stopImmediatePropagation();
    if(input.dataset.size && !positive(input.value) && selectedItem()) input.value=selectedItem()[input.dataset.size];
    updateFlowField(input);
    return;
  }
  if(!['flow-plan','flow-room-photo'].includes(input.id)) return;
  event.stopImmediatePropagation();
  const file=input.files?.[0];
  if(!file) return;
  draft.error='';
  if(!usableImages.includes(file.type)||file.size>8*1024*1024) {
    draft.error='8MB 이하 JPG, PNG, WebP 파일을 선택해 주세요.';
    render();
    return;
  }
  if(input.id==='flow-room-photo') {
    if(draft.photoUrl) URL.revokeObjectURL(draft.photoUrl);
    draft.photo=file;
    draft.photoUrl=URL.createObjectURL(file);
    draft.photoStatus='idle';
    draft.photoMessage='';
    draft.items=draft.items.filter(i=>i.source!=='yolo');
    clearRoutes();
    render();
    if(draft.page===4) detectPhotoFurniture();
    return;
  }
  const token=++draft.uploadToken;
  state.photoLoading=true;
  render();
  try {
    const data=await fileData(file);
    if(token!==draft.uploadToken) return;
    state.floorplanData=data;
    state.floorplanImage=null;
    state.photo=null;
    state.structure.labels=state.structure.room=null;
    state.wall={status:'idle',mask:null,message:'구조 인식 대기',overlay:null};
    state.startPoint=state.endPoint=null;
    draft.items=draft.items.filter(i=>i.source!=='yolo');
    draft.photoStatus='idle';
    draft.photoMessage='';
    clearRoutes();
    await loadRoomPhoto(data,file.name);
    if(token===draft.uploadToken) draft.error=state.photoError;
  } catch(error) {
    if(token===draft.uploadToken) draft.error=error.message;
  } finally {
    if(token===draft.uploadToken) {state.photoLoading=false;render();}
  }
},true);

document.addEventListener('click',event=>{
  const button=event.target.closest('#workspace button, #progress button');
  if(!button || button.disabled) return;
  event.stopImmediatePropagation();
  const d=button.dataset;
  if(d.flowPage){flowGo(Number(d.flowPage));return;}
  if(d.roomUse){state.roomUse=d.roomUse;if(d.roomUse==='아기방'){state.width='3000';state.height='2400';}else if(d.roomUse==='침실'){state.width='3300';state.height='2700';}render();return;}
  if(d.multi==='needs'){
    if(d.value==='해당없음')state.needs=['해당없음'];
    else {
      const needs=state.needs.filter(value=>value!=='해당없음');
      state.needs=needs.includes(d.value)?needs.filter(value=>value!==d.value):[...needs,d.value];
    }
    draft.picks=draft.picks.filter(id=>recommendProducts().some(p=>p.id===id));
    render();return;
  }
  if(d.pick){
    draft.picks=draft.picks.includes(d.pick)?draft.picks.filter(id=>id!==d.pick):[...draft.picks,d.pick];
    render();return;
  }
  if(d.photoItem){draft.active=d.photoItem;draft.correction=true;render();return;}
  if(d.itemId){draft.active=d.itemId;draft.correction=false;render();return;}
  if(d.view){stopMotion(true);stopLayoutMotion(true);draft.view=d.view;draft.visitLabels=(d.view==='before'?draft.compare:draft.route)?.labels||[];render();return;}
  if(d.layer){draft.simulationLayer=d.layer;render();return;}
  if(d.overlay){if(d.overlay==='narrow')draft.showNarrow=!draft.showNarrow;if(d.overlay==='corners')draft.showCorners=!draft.showCorners;render();return;}
  if(d.endpoint){state.tapMode=d.endpoint;render();return;}
  switch(d.flow||d.action) {
    case 'search': flowGo(1);return;
    case 'back': flowGo(draft.page-1);return;
    case 'to-room': flowGo(2);return;
    case 'analyze': analyzeWalls();return;
    case 'room-confirm':
    case 'confirm-room':
      if(!roomBounds()) return;
      sessionStorage.setItem('roomai.selectedRoom',JSON.stringify({labels:state.structure.labels,room:state.structure.room}));
      flowGo(3);return;
    case 'to-layout': flowGo(4);return;
    case 'retry-photo': detectPhotoFurniture();return;
    case 'to-sim': {
      stopLayoutMotion(true);state.tapMode='start';
      const ready=prepareAutomaticSimulation();
      flowGo(5);
      if(ready) requestAnimationFrame(()=>replayLayout());
      return;
    }
    case 'walk-play': playLayout(false);return;
    case 'walk-pause': stopLayoutMotion(false);render();return;
    case 'walk-replay': replayLayout();return;
    case 'run-life-simulation': runLifeSimulation();return;
    case 'optimize-layout':
      stopLayoutMotion(true);optimizeFurnitureLayout();render();return;
    case 'apply-optimization':
      if(draft.optimization){draft.optimization.applied=true;draft.optimizationMessage='';draft.photoMessage='AI 추천 배치를 적용했어요. 가구를 직접 끌어 추가로 수정할 수 있어요.';}
      render();return;
    case 'cancel-optimization': restoreOptimization();render();return;
    case 'add-products':
      for(const product of unplacedProducts()) addLayoutItem({name:product.group||product.kind,w:product.width,d:product.depth,source:'product',productId:product.id});
      break;
    case 'add-manual': {
      const name=window.prompt('가구 이름을 입력해 주세요.','수납장')?.trim();
      if(name) addLayoutItem({name:name.slice(0,60),w:60,d:40,source:'manual'});
      break;
    }
    case 'rotate-item': {
      const item=selectedItem();
      if(item) [item.w,item.d]=[item.d,item.w];
      break;
    }
    case 'remove-item': draft.items=draft.items.filter(item=>item.id!==draft.active);draft.active=draft.items.at(-1)?.id;break;
    case 'run':
      if(!layoutFits()||!state.startPoint||!state.endPoint||!positive(state.passage)) return;
      clearRoutes();
      draft.compare=findLayoutRoute(beforeLayoutItems());
      draft.route=findLayoutRoute(draft.items);
      render();replayLayout();return;
    case 'replay': replayLayout();return;
    default: return;
  }
  clearRoutes();
  render();
},true);
$('#chat-result').textContent='동선 시뮬레이션 열기';
$('#chat-result').onclick=()=>{chat.close();if(draft.page>=4) flowGo(5);};
render();
</script></body></html>
