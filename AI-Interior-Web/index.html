<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROOMMATE AI · AI 인테리어</title>
  <style>
    :root{--bg:#f7f3ea;--paper:#fcfaf5;--ink:#293027;--muted:#77766d;--line:#e5ded0;--olive:#707c59;--olive2:#87926e;--red:#c25b4e;--good:#e8ebdd}
    *{box-sizing:border-box} body{margin:0;background:#ddd8cd;color:var(--ink);font-family:Arial,"Malgun Gothic",sans-serif}
    button,input,textarea{font:inherit} button{cursor:pointer} .app{width:min(100%,440px);min-height:100vh;margin:auto;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 28px #8e897c55}
    header{height:78px;border-bottom:1px solid var(--line);padding:14px 20px 10px;display:flex;align-items:center;gap:12px}.back{width:30px;border:0;background:none;font-size:35px;color:#353c2f;line-height:1}.back:disabled{color:#d5d0c5}.brand{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--olive2)}.step{font-size:13px;font-weight:700;margin-top:4px}.badge{margin-left:auto;color:#9a9588;font-size:10px;border:1px solid #d9d3c5;padding:5px 7px;border-radius:4px}
    main{padding:22px;flex:1;overflow:auto}.eyebrow{font-size:11px;letter-spacing:1.8px;font-weight:800;color:var(--olive2);margin-top:4px}.title{font-size:29px;line-height:1.28;margin:12px 0 0;font-weight:800}.subtitle{font-size:14px;line-height:1.55;color:var(--muted);margin:12px 0 16px}.section{font-size:14px;font-weight:800;color:#3e463a;margin:21px 0 10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #d8d2c5;border-radius:24px;padding:11px 18px;background:#fbf9f3;color:#696a61;font-weight:700}.chip.active{background:var(--olive);border-color:var(--olive);color:#fffdf7}.fields{display:flex;gap:12px}.field{flex:1;margin-top:10px}.label{font-size:12px;color:#6c6d64;margin-bottom:7px;display:block}.inputline{display:flex;align-items:center;border-bottom:1px solid #c6c0b3;padding-bottom:6px}.inputline input{width:100%;border:0;outline:0;background:transparent;color:#2e352d;font-size:17px}.unit{font-size:13px;color:#868477;white-space:nowrap}.tip,.hint{margin-top:28px;padding:15px;background:#eeeddf;border-radius:12px;color:#65685b;font-size:12px}.tip b{color:#89936e;font-size:18px;margin-right:8px}.bottom{padding:14px 20px;border-top:1px solid #e6dfd3;background:var(--bg)}.primary{width:100%;height:56px;border:0;border-radius:15px;background:var(--olive);color:white;font-weight:800;font-size:16px;position:relative}.primary span{position:absolute;right:19px;font-size:22px}.primary:disabled{background:#bebeb3}.cards{display:grid;gap:13px}.card{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:11px;text-align:left}.card.selected{border:2px solid var(--olive)}.photo{width:103px;height:120px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#ffffff99;font-size:10px;letter-spacing:1.5px}.photo strong{font-size:45px;color:#4b463680;margin-top:8px}.info{flex:1}.product-top{display:flex;gap:4px}.product-name{font-weight:800;font-size:15px;line-height:1.35;flex:1}.check{color:var(--olive);font-size:20px}.price{font-size:17px;font-weight:800;color:#5f6f4b;margin-top:12px}.meta{font-size:12px;color:#7a796f;margin-top:7px}.shop{font-size:11px;color:#9a9589;margin-top:14px}.empty{margin-top:30px;padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:16px;text-align:center}.empty h3{margin:0}.empty p{color:var(--muted);font-size:13px}.outline{padding:12px;border:1px solid var(--olive);border-radius:10px;background:transparent;color:#687653;font-weight:800}
    .plan{background:#fcfaf4;border:1px solid #ded7c8;border-radius:16px;padding:12px;margin-top:9px}.plan-title{color:#77776c;font-size:11px;margin-bottom:8px}.floor{height:280px;background:#eae5d7;border:3px solid #c5bdae;position:relative;overflow:hidden}.window{position:absolute;top:0;left:27%;background:#d4d9cc;color:#65735d;padding:4px 14px;font-size:10px}.door{position:absolute;left:4px;bottom:12px;color:#6e6b60;font-size:11px;text-align:center}.object{position:absolute;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#4e5047;font-weight:800;font-size:12px}.desk{right:20px;top:29px;width:102px;height:43px;background:#a78d6d}.chair{right:50px;top:82px;width:42px;height:30px;border-radius:14px;background:#c1ad8f}.wardrobe{right:15px;bottom:27px;width:98px;height:57px;background:#7c806d}.dryer{left:50px;bottom:22px;width:91px;height:43px;background:#b1a99a}.dryer.rec{left:28px;top:30px;bottom:auto;background:#aeb79d}.placed{left:20px;top:36px;width:88px;height:38px;background:#c9a477}.placed.windowplace{left:25px;top:132px}.placed.rotated{width:38px;height:88px}.actions,.compare-actions{display:flex;gap:9px;margin-top:11px}.small{flex:1;min-height:42px;border-radius:10px;border:1px solid #cfc8ba;background:#fbf9f3;color:#65685d;font-weight:800}.small.filled{background:var(--olive);border-color:var(--olive);color:white}.collapse{margin-top:23px;border-top:1px solid #e3dccf;border-bottom:1px solid #e3dccf;padding:16px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:800}.optional{font-size:11px;color:#969288;font-weight:500}.textarea{width:100%;min-height:94px;background:#fbf9f3;border:1px solid #ddd6c9;border-radius:11px;padding:13px;color:#3c4339;font-size:13px;line-height:1.5;resize:vertical}.helper{color:#979389;font-size:11px;margin-top:7px}.legend{display:flex;gap:20px;margin-bottom:8px;font-size:11px;color:#7a796f}.routekey{color:#65816a;font-size:18px}.blockkey{color:#c86758}.route{position:absolute;left:24px;bottom:39px;width:190px;height:118px;border-top:4px solid #65816a;border-right:4px solid #65816a;border-top-right-radius:90px;transform:rotate(-16deg)}.route.rec{width:145px;height:170px;left:31px;bottom:35px;transform:rotate(-35deg)}.blocked{position:absolute;right:42px;bottom:76px;width:90px;height:39px;background:#c25b4eb8;border-radius:8px;transform:rotate(-4deg)}.blocked.rec{opacity:.15;background:#8b9a76}.route-label{position:absolute;color:#5f665b;font-size:10px;font-weight:800}.start{left:14px;bottom:15px}.end{right:20px;bottom:88px}.metrics{display:flex;align-items:center;background:#eeeddf;border-radius:13px;margin-top:12px;padding:13px}.metric{flex:1}.metric-label{font-size:11px;color:#76776c}.metric-value{font-size:21px;font-weight:900;margin-top:5px;color:#3a4434}.good{color:#657c5f}.arrow{font-size:21px;color:#82906d;padding:0 9px}.reason{margin-top:12px;padding:14px;border-radius:12px;background:#f3e4df}.reason.goodbox{background:var(--good)}.reason-label{font-size:10px;font-weight:900;letter-spacing:1.4px;color:#b05d50}.reason p{font-size:14px;line-height:1.45;font-weight:700;margin:5px 0 0;color:#55554d}.segment{display:flex;gap:4px;background:#e7e2d7;padding:4px;border-radius:10px;margin:13px 0}.segment button{flex:1;padding:11px;border:0;border-radius:8px;background:transparent;color:#77766c;font-weight:800}.segment button.active{background:var(--olive);color:#fffdf7}.notice{margin-top:30px;padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:16px;text-align:center}.notice h3{font-size:17px;margin:0}.notice p{font-size:13px;color:var(--muted);line-height:1.5}.redhint{margin-top:14px;color:#969286;font-size:11px}.redhint b{color:var(--red)}
    @media(max-width:360px){main{padding:17px}.title{font-size:26px}.photo{width:88px}}
  </style>
</head>
<body>
<div class="app">
  <header><button id="back" class="back" disabled>‹</button><div><div class="brand">ROOMMATE AI</div><div id="stepText" class="step">1/5 가구 조건</div></div><div class="badge">시연용 데이터</div></header>
  <main id="main"></main>
  <div class="bottom"><button id="primary" class="primary"><span>→</span></button></div>
</div>
<script>
  const DEMO='내가 책상에서 공부하는 동안 룸메가 건조대를 펼친 채 현관에서 옷장으로 가요.';
  const state={step:1,type:'수납장',style:'원목',budget:'20',maxWidth:'80',selected:'wood-cabinet',position:'left',rotated:false,roomWidth:'360',roomHeight:'270',passage:'65',height:'170',age:'30',weight:'65',routine:DEMO,body:false,compare:'current'};
  const products=[
    {id:'wood-cabinet',type:'수납장',style:'원목',name:'담은 원목 수납장 2단',price:159000,width:78,depth:35,shop:'오늘의 집 데모몰',tone:'#c9a477'},
    {id:'low-cabinet',type:'수납장',style:'원목',name:'느린 나무 낮은 수납장',price:189000,width:80,depth:38,shop:'무드룸 데모샵',tone:'#b48758'},
    {id:'oak-shelf',type:'선반',style:'원목',name:'결이 보이는 오크 선반',price:119000,width:75,depth:30,shop:'리빙픽 데모몰',tone:'#d0aa78'},
    {id:'modern-desk',type:'책상',style:'모던',name:'선명한 라인 데스크',price:199000,width:100,depth:50,shop:'모던하우스 데모',tone:'#9b9c91'},
    {id:'minimal-shelf',type:'선반',style:'미니멀',name:'얇은 프레임 선반',price:99000,width:60,depth:25,shop:'작은방 데모샵',tone:'#d8d4c8'}];
  const money=n=>Math.round(n/10000)+'만 원'; const filtered=()=>products.filter(p=>p.type===state.type&&p.style===state.style&&p.price<=Number(state.budget||0)*10000&&p.width<=Number(state.maxWidth||0)); const selected=()=>products.find(p=>p.id===state.selected)||products[0];
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function input(label,key,unit){return `<label class="field"><span class="label">${label}</span><span class="inputline"><input data-key="${key}" value="${esc(state[key])}" inputmode="numeric"><span class="unit">${unit}</span></span></label>`}
  function chips(values,key){return `<div class="chips">${values.map(v=>`<button class="chip ${state[key]===v?'active':''}" data-select="${key}" data-value="${v}">${v}</button>`).join('')}</div>`}
  function plan(sim=false){let rec=state.compare==='recommended';let p=selected();return `<div class="plan">${sim?`<div class="legend"><span><b class="routekey">━</b> 이동 경로</span><span><b class="blockkey">■</b> 좁은 구간</span></div>`:`<div class="plan-title">샘플 원룸 · 360 × 270cm</div>`}<div class="floor"><div class="window">창문 ─────────</div><div class="door">현관<br>↘</div><div class="object desk">책상</div><div class="object chair">의자</div><div class="object wardrobe">옷장</div><div class="object dryer ${rec?'rec':''}">건조대</div>${sim?`<div class="route ${rec?'rec':''}"></div><div class="blocked ${rec?'rec':''}"></div><div class="route-label start">현관</div><div class="route-label end">옷장</div>`:`<div class="object placed ${state.position==='window'?'windowplace':''} ${state.rotated?'rotated':''}" style="background:${p.tone}">${p.type}</div>`}</div></div>`}
  function metrics(){let demo=state.routine.trim()===DEMO;let n=state.compare==='recommended'?72:55;return `<div class="metrics"><div class="metric"><div class="metric-label">가장 좁은 통로</div><div class="metric-value ${state.compare==='recommended'?'good':''}">${demo?n+'cm':'—'}</div></div>${state.compare==='recommended'?'<div class="arrow">→</div>':''}<div class="metric"><div class="metric-label">내가 설정한 통로 폭</div><div class="metric-value">${esc(state.passage)}cm</div></div></div>`}
  function render(){const titles=['가구 조건','검색 결과','방에 배치','생활 시뮬레이션','추천 배치'];document.getElementById('stepText').textContent=`${state.step}/5 ${titles[state.step-1]}`;document.getElementById('back').disabled=state.step===1;let html='';
    if(state.step===1)html=`<div class="eyebrow">AI INTERIOR GUIDE</div><h1 class="title">내 방에 어울리는<br>가구부터 찾아볼까요?</h1><p class="subtitle">조건을 고르면 시연용 상품을 바로 보여드려요.</p><div class="section">가구 종류</div>${chips(['수납장','책상','선반'],'type')}<div class="section">스타일</div>${chips(['원목','모던','미니멀'],'style')}<div class="fields">${input('예산','budget','만 원 이하')}${input('최대 가로폭','maxWidth','cm')}</div><div class="tip"><b>✦</b>처음이라면 예산과 폭을 넉넉하게 잡아보세요.</div>`;
    if(state.step===2){let list=filtered();html=`<div class="eyebrow">DEMO SEARCH</div><h1 class="title">조건에 맞는 가구<br>${list.length}개를 찾았어요.</h1><p class="subtitle">카드를 눌러 내 방에 놓아볼 가구를 선택하세요.</p>`;html+=list.length?`<div class="cards">${list.map(p=>`<button class="card ${p.id===state.selected?'selected':''}" data-product="${p.id}"><div class="photo" style="background:${p.tone}">PHOTO<strong>▥</strong></div><div class="info"><div class="product-top"><div class="product-name">${p.name}</div><div class="check">${p.id===state.selected?'✓':''}</div></div><div class="price">${money(p.price)}</div><div class="meta">${p.width} × ${p.depth}cm · ${p.style}</div><div class="shop">${p.shop} · ★ 4.7</div></div></button>`).join('')}</div>`:`<div class="empty"><h3>조건에 맞는 상품이 없어요.</h3><p>예산이나 최대 폭을 조금 넓혀보세요.</p><button class="outline" data-go="1">조건 다시 선택</button></div>`}
    if(state.step===3)html=`<div class="eyebrow">MY ROOM</div><h1 class="title">이 가구를 놓고<br>하루를 살아볼게요.</h1><p class="subtitle">샘플 원룸에 배치하고 생활 패턴을 알려주세요.</p>${plan()}<div class="actions"><button class="small" data-move>위치 바꾸기</button><button class="small" data-rotate>90도 회전</button></div><div class="section">방 크기와 통로</div><div class="fields">${input('방 가로','roomWidth','cm')}${input('방 세로','roomHeight','cm')}</div>${input('필요한 통로 폭','passage','cm')}<button class="collapse" data-body>내 몸 정보 <span class="optional">선택 입력　${state.body?'⌃':'⌄'}</span></button>${state.body?`<div class="fields">${input('키','height','cm')}${input('나이','age','세')}${input('몸무게','weight','kg')}</div>`:''}<div class="section">생활 패턴</div><textarea id="routine" class="textarea" placeholder="예: 아침에 현관에서 창가까지 걸어요.">${esc(state.routine)}</textarea><div class="helper">현재 시연은 예시 문장에 맞춘 경로만 보여줘요.</div>`;
    if(state.step===4){let demo=state.routine.trim()===DEMO;html=demo?`<div class="eyebrow">LIVEABILITY CHECK</div><h1 class="title">어디에서 이동이<br>불편해질까요?</h1><p class="subtitle">현관에서 옷장까지, 룸메의 이동을 따라가 봤어요.</p>${plan(true)}${metrics()}<div class="reason"><div class="reason-label">WHY</div><p>건조대를 펼치면 옷장 앞 통로가 좁아져요.</p></div><div class="redhint"><b>●</b> 빨간 구간은 설정한 통로 폭보다 좁은 곳이에요.</div>`:`<div class="eyebrow">LIVEABILITY CHECK</div><h1 class="title">아직 분석할 수 있는<br>시연 예시가 아니에요.</h1><p class="subtitle">현재 프론트엔드 데모는 제공된 생활 패턴 문장만 분석해요.</p><div class="notice"><h3>임의의 이동 경로를 만들지 않았어요.</h3><p>이전 화면에서 시연 예시 문장으로 돌아가면 결과를 확인할 수 있어요.</p></div>`}
    if(state.step===5){let rec=state.compare==='recommended';html=`<div class="eyebrow">LAYOUT COMPARE</div><h1 class="title">조금 바꾸면, 동선이<br>더 편해져요.</h1><p class="subtitle">두 배치를 번갈아 보며 내 생활에 맞는 쪽을 골라보세요.</p><div class="segment"><button class="${!rec?'active':''}" data-compare="current">현재 배치</button><button class="${rec?'active':''}" data-compare="recommended">추천 배치</button></div>${plan(true)}${metrics()}<div class="reason ${rec?'goodbox':''}"><div class="reason-label">${rec?'BETTER':'WHY'}</div><p>${rec?'건조대를 창가 쪽으로 옮기면 옷장 앞 동선이 넓어져요.':'건조대를 펼치면 옷장 앞 통로가 좁아져요.'}</p></div><div class="compare-actions"><button class="small" data-resim>다시 시뮬레이션</button><button class="small filled" data-apply>추천 배치 적용</button></div>`}
    document.getElementById('main').innerHTML=html;let primary=document.getElementById('primary');let labels=['가구 찾아보기','내 방에 배치하기','시뮬레이션 실행','추천 배치 보기','추천 배치 적용'];primary.innerHTML=`${state.step===4&&!demo?'시연 예시로 돌아가기':labels[state.step-1]}<span>→</span>`;primary.disabled=state.step===2&&filtered().length===0;bind();}
  function bind(){document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{state[b.dataset.select]=b.dataset.value;render()});document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.product;render()});document.querySelectorAll('input[data-key]').forEach(i=>i.oninput=()=>state[i.dataset.key]=i.value);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.step=+b.dataset.go;render()});let r=document.getElementById('routine');if(r)r.oninput=()=>state.routine=r.value;let move=document.querySelector('[data-move]');if(move)move.onclick=()=>{state.position=state.position==='left'?'window':'left';render()};let rot=document.querySelector('[data-rotate]');if(rot)rot.onclick=()=>{state.rotated=!state.rotated;render()};let body=document.querySelector('[data-body]');if(body)body.onclick=()=>{state.body=!state.body;render()};document.querySelectorAll('[data-compare]').forEach(b=>b.onclick=()=>{state.compare=b.dataset.compare;render()});let res=document.querySelector('[data-resim]');if(res)res.onclick=()=>{state.compare='current';state.step=4;render()};let apply=document.querySelector('[data-apply]');if(apply)apply.onclick=()=>{state.position='window';state.compare='recommended';state.step=3;render()}}
  document.getElementById('back').onclick=()=>{if(state.step>1){state.step--;render()}};document.getElementById('primary').onclick=()=>{if(state.step===1)state.step=2;else if(state.step===2&&filtered().length)state.step=3;else if(state.step===3)state.step=4;else if(state.step===4){if(state.routine.trim()===DEMO){state.compare='recommended';state.step=5}else{state.routine=DEMO;state.step=3}}else if(state.step===5){state.position='window';state.step=3}render()};render();
</script>
</body>
</html>
